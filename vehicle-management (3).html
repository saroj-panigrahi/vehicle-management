function vehiclesForBranch(branch){
  return vehicles.filter(v=>!['Inactive','Under Maintenance'].includes(v.status) && (!branch || v.branch===branch));
}
function isVehicleInBranch(vehicleId, branch){
  if(!branch) return true;
  const v=vehicles.find(x=>x.id===vehicleId);
  return !!(v && v.branch===branch);
}
function isDriverInBranch(driverId, branch){
  if(!branch) return true;
  const d=drivers.find(x=>x.id===driverId);
  if(!d || d.status==='Inactive') return false;
  const active=driverAssignments.find(a=>a.driverId===driverId&&a.status==='Active');
  const vid=active?active.vehicleId:d.vehicleId;
  if(vid){
    const v=vehicles.find(x=>x.id===vid);
    return !!(v && v.branch===branch);
  }
  // Unassigned Available drivers can be used on any branch in this demo
  return d.status==='Available';
}
function driversForBranch(branch){
  return drivers.filter(d=>d.status!=='Inactive' && isDriverInBranch(d.id, branch));
}
function customersBelongToBranch(customerIds, branch){
  return customersByIds(customerIds).every(c=>!branch || c.branch===branch);
}
function pruneSelectedCustomersForBranch(branch){
  if(!branch) return [];
  const removed=[];
  selectedCustomerIds=selectedCustomerIds.filter(id=>{
    const c=customers.find(x=>x.id===id);
    if(c && c.branch===branch) return true;
    if(c) removed.push(c.name);
    return false;
  });
  return removed;
}
function onCreateActivityBranchChange(){
  const branchEl=document.getElementById('create-activity-branch');
  const branch=branchEl?branchEl.value:'';
  const removed=pruneSelectedCustomersForBranch(branch);
  refreshCreateActivityFleet();

    showToast(`Removed ${removed.length} customer(s) not in ${branch}: ${removed.slice(0,3).join(', ')}${removed.length>3?'…':''}`,'warning');
  }
}
function currentAssignments(vid){ return driverAssignments.filter(x=>x.vehicleId===vid&&x.status==='Active'); }
function currentDrivers(vid){ return currentAssignments(vid).map(a=>dName(a.driverId)).filter(Boolean); }
function currentDriver(vid){ const names=currentDrivers(vid); return names.length?names.join(', '):null; }

function isDriverAssignedToVehicle(driverId, vehicleId){
  return driverAssignments.some(a=>a.driverId===driverId&&a.vehicleId===vehicleId&&a.status==='Active');
}
function showToast(msg, type='success') {
  const c={success:'bg-emerald-600',error:'bg-red-600',info:'bg-blue-600',warning:'bg-amber-600'};
  const t=document.createElement('div');
  t.className=`toast ${c[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-[280px] max-w-sm`;
  t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}"></i><span class="text-sm">${msg}</span>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);
}

/** Trip statuses that block assigning another trip to the same vehicle. */
const TRIP_CONFLICT_STATUSES=['Assigned','Started','In Progress'];
/** On-road occupancy (driver/vehicle busy executing). */
const TRIP_OCCUPIED_STATUSES=['Started','In Progress'];
function hasActiveTrip(vehicleId, excludeTripId=null){
  return trips.some(t=>
    t.vehicleId===vehicleId
    && t.id!==excludeTripId
    && TRIP_CONFLICT_STATUSES.includes(t.status)
  );
}
/** Badge for trip-assignment screens: Occupied (on road) / Assigned (planned) / Available. */
function vehicleTripAvailabilityBadge(vehicleId){
  if(isVehicleOccupied(vehicleId)) return occupancyBadge(true);
  if(hasActiveTrip(vehicleId)) return badge('Assigned');
  return occupancyBadge(false);
}
function hasActiveDriverAssignment(driverId){ return driverAssignments.some(a=>a.driverId===driverId&&a.status==='Active'); }
/** Eligible for new assign / available counter: not inactive, not occupied, not already assigned. */
function isDriverEligibleForNewAssign(d){
  if(!d||d.status==='Inactive') return false;
  if(isDriverOccupied(d.id)) return false;
  if(hasActiveDriverAssignment(d.id)) return false;
  return true;
}
/** Release every active assignment on a vehicle into history. Returns count released. */
function releaseAllVehicleAssignments(vehicleId){
  const active=driverAssignments.filter(x=>x.vehicleId===vehicleId&&x.status==='Active');
  active.forEach(a=>{
    a.status='Released';
    a.end=nowStamp();
    const d=drivers.find(x=>x.id===a.driverId);
    if(!d) return;
    if(!hasActiveDriverAssignment(d.id)){
      d.vehicleId=null;
      if(!isDriverOccupied(d.id)) d.status='Available';
    }
  });
  return active.length;
}
/** Occupied = Started / In Progress only (on-road). Assigned trips are "busy for new trips" via hasActiveTrip. */
function isVehicleOccupied(vehicleId){
  return trips.some(t=>t.vehicleId===vehicleId&&TRIP_OCCUPIED_STATUSES.includes(t.status))
    || activities.some(a=>{
      if(a.status!=='In Progress'||!a.tripId) return false;
      const t=trips.find(x=>x.id===a.tripId);
      return t&&t.vehicleId===vehicleId;
    });
}
function isDriverOccupied(driverId, excludeTripId=null){
  return trips.some(t=>
      t.driverId===driverId
      && t.id!==excludeTripId
      && TRIP_OCCUPIED_STATUSES.includes(t.status)
    )
    || activities.some(a=>{
      if(a.status!=='In Progress'||!a.tripId) return false;
      if(excludeTripId && a.tripId===excludeTripId) return false;
      const t=trips.find(x=>x.id===a.tripId);
      return t&&t.driverId===driverId;
    });
}
function occupancyLabel(occupied){ return occupied?'Occupied':'Available'; }
function occupancyBadge(occupied){ return badge(occupancyLabel(occupied)); }
function activityTrip(a){ return a.tripId?trips.find(x=>x.id===a.tripId):null; }
function activityTripHistory(a){
  const ids=[...(a.previousTripIds||[])];
  if(a.tripId && !ids.includes(a.tripId)) ids.push(a.tripId);
  return ids.map(id=>trips.find(t=>t.id===id)).filter(Boolean);
}
function batchActivities(batchId){ return activities.filter(a=>a.batchId===batchId); }
function tripRefExists(ref, excludeTripId=null){
  const norm=(ref||'').trim().toLowerCase();
  if(!norm) return false;
  return trips.some(t=>t.ref && t.ref.trim().toLowerCase()===norm && t.id!==excludeTripId);
}
function normalizeTime(timeStr, fallbackTime='08:00'){
  const raw=String(timeStr||'').trim();
  const m=raw.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if(!m) return fallbackTime;
  const hh=Math.min(23, Math.max(0, parseInt(m[1],10)));
  const mm=Math.min(59, Math.max(0, parseInt(m[2],10)));
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function splitDateTime(value, fallbackTime='08:00'){
  const parts=String(value||'').trim().split(/\s+/);
  return { date: parts[0]||'', time: normalizeTime(parts[1], fallbackTime) };
}
function combineDateTime(dateStr, timeStr){
  return `${dateStr} ${normalizeTime(timeStr,'08:00')}`;
}
function isScheduleValid(startStr, dueStr){
  const s=new Date(String(startStr).replace(' ','T'));
  const d=new Date(String(dueStr).replace(' ','T'));
  return !isNaN(s) && !isNaN(d) && d > s;
}
/** Rebuild schedule on a new date; keep times; if due<=start on same day, push due to 23:59. */
function rebuildScheduleOnDate(startStr, dueStr, newDate){
  const startParts=splitDateTime(startStr,'08:00');
  const dueParts=splitDateTime(dueStr,'18:00');
  let nextStart=combineDateTime(newDate, startParts.time);
  let nextDue=combineDateTime(newDate, dueParts.time);
  if(!isScheduleValid(nextStart, nextDue)){
    nextDue=combineDateTime(newDate, '23:59');
  }
  if(!isScheduleValid(nextStart, nextDue)){
    // Extreme: start was 23:59 — bump due to next calendar day 01:00
    const day=new Date(`${newDate}T00:00:00`);
    day.setDate(day.getDate()+1);
    const y=day.getFullYear();
    const mo=String(day.getMonth()+1).padStart(2,'0');
    const da=String(day.getDate()).padStart(2,'0');
    nextDue=`${y}-${mo}-${da} 01:00`;
  }
  return { start: nextStart, due: nextDue, ok: isScheduleValid(nextStart, nextDue) };
}
function deliveryTerminalStatuses(){ return ['Delivered','Failed','Partial','Returned']; }
function pendingDeliveriesForActivity(a){
  // Only current trip deliveries gate completion; released-trip deliveries stay in history
  if(!a.tripId) return [];
  return deliveries.filter(d=>d.tripId===a.tripId && !deliveryTerminalStatuses().includes(d.status));
}
function syncTripDriverAssignment(trip, oldDriverId, newDriverId){
  if(!trip || !newDriverId || oldDriverId===newDriverId) return;
  const vehicleId=trip.vehicleId;
  const now=nowStamp();
  // Release old active assignment on this vehicle for the previous trip driver
  if(oldDriverId){
    driverAssignments.filter(a=>a.driverId===oldDriverId&&a.vehicleId===vehicleId&&a.status==='Active').forEach(a=>{
      a.status='Released';
      a.end=now;
      a.reason=a.reason||'Trip driver transfer';
    });
    const od=drivers.find(x=>x.id===oldDriverId);
    if(od){
      if(!hasActiveDriverAssignment(od.id)) od.vehicleId=null;
      if(od.status==='On Duty'&&!isDriverOccupied(od.id, trip.id)){
        od.status=hasActiveDriverAssignment(od.id)?'Assigned':'Available';
      } else if(!hasActiveDriverAssignment(od.id)&&!isDriverOccupied(od.id, trip.id)&&od.status==='Assigned'){
        od.status='Available';
      }
    }
  }
  // Ensure new driver has Active assignment on this vehicle
  let row=driverAssignments.find(a=>a.driverId===newDriverId&&a.vehicleId===vehicleId&&a.status==='Active');
  if(!row){
    // Release any other active assignment for the new driver elsewhere
    driverAssignments.filter(a=>a.driverId===newDriverId&&a.status==='Active').forEach(a=>{
      a.status='Released';
      a.end=now;
      a.reason=a.reason||'Moved via trip transfer';
    });
    const nextId=Math.max(0,...driverAssignments.map(x=>x.id))+1;
    driverAssignments.unshift({
      id:nextId,vehicleId,driverId:newDriverId,
      start:now,end:null,status:'Active',reason:'Trip transfer'
    });
  }
  const nd=drivers.find(x=>x.id===newDriverId);
  if(nd){
    nd.vehicleId=vehicleId;
    if(TRIP_OCCUPIED_STATUSES.includes(trip.status)||activities.some(a=>a.tripId===trip.id&&a.status==='In Progress')){
      nd.status='On Duty';
    } else if(nd.status!=='On Duty'){
      nd.status='Assigned';
    }
  }
}
function validateTransferPlan(movingIds, newDriverId, newDate){
  const errors=[];
  const moving=movingIds.map(id=>activities.find(a=>a.id===id)).filter(Boolean);
  if(!moving.length) return { ok:false, errors:['No activities selected for transfer.'], moving:[] };

  const branches=[...new Set(moving.map(a=>a.branch).filter(Boolean))];
  if(newDriverId && branches.length>1){
    errors.push(`Cannot assign one driver to activities across branches: ${branches.join(', ')}. Transfer one branch at a time.`);
  }
  if(newDriverId){
    const d=drivers.find(x=>x.id===newDriverId);
    if(!d) errors.push('Selected driver not found.');
    else if(d.status==='Inactive') errors.push('Selected driver is Inactive.');
    else if(isDriverOccupied(newDriverId)) errors.push('Selected driver is Occupied (Started / In Progress trip).');
    else {
      for(const a of moving){
        if(a.branch && !isDriverInBranch(newDriverId, a.branch)){
          errors.push(`${d.name} is not available for branch ${a.branch} (${a.name}).`);
        }
      }
    }
  }

  for(const a of moving){
    if(a.status==='Completed') errors.push(`Cannot transfer completed activity: ${a.name}`);
    if(newDriverId){
      if(!a.tripId){
        errors.push(`${a.name}: no current trip — cannot change driver. Assign a trip first or transfer date only.`);
      } else {
        const t=activityTrip(a);
        if(!t) errors.push(`${a.name}: linked trip not found.`);
        else if(['Completed','Released','Cancelled'].includes(t.status)){
          errors.push(`${a.name}: trip ${t.ref} is ${t.status} and cannot be reassigned.`);
        }
      }
    }
    if(newDate){
      const rebuilt=rebuildScheduleOnDate(a.start, a.due, newDate);
      if(!rebuilt.ok){
        errors.push(`${a.name}: cannot build a valid schedule on ${newDate} (due must be after start).`);
      }
      const t=activityTrip(a);
      if(t){
        const tripRebuilt=rebuildScheduleOnDate(t.start||a.start, t.expected||a.due, newDate);
        if(!tripRebuilt.ok){
          errors.push(`${a.name}: linked trip schedule would be invalid after date change.`);
        }
      }
    }
  }

  if(!newDriverId && !newDate){
    errors.push('Choose a new driver and/or a new date to transfer.');
  }

  return { ok: errors.length===0, errors, moving, branches };
}
function refreshDocStatuses() {
  const today=new Date();
  documents.forEach(d=>{
    const exp=new Date(d.expiry);
    const days=(exp-today)/(1000*60*60*24);
    if(days<0) d.status='Expired';
    else if(days<=30) d.status='Expiring Soon';
    else d.status='Valid';
  });
}

function toggleOwnershipFields() {
  const val=document.getElementById('ownership-select')?.value;
  document.getElementById('owned-fields')?.classList.toggle('hidden',val!=='Owned');
  document.getElementById('rented-fields')?.classList.toggle('hidden',val!=='Rented');
}
function submitVehicle(e) {
  e.preventDefault();
  const f=e.target;
  const number=f.number.value.trim();
  if(!number){showToast('Vehicle number required','error');return;}
  if(f.ownership.value==='Rented'&&(!f.rentalProvider.value||!f.rentalStart.value||!f.rentalEnd.value)){showToast('Rental details required','error');return;}
  if(editingVehicleId){
    const v=vehicles.find(x=>x.id===editingVehicleId);
    if(v){
      const oldBranch=v.branch;
      Object.assign(v,{number,type:f.type.value,brand:f.brand.value,model:f.model.value,regDate:f.regDate.value,capacity:parseFloat(f.capacity.value),capacityUnit:f.capacityUnit.value,ownership:f.ownership.value,branch:f.branch.value,notes:f.notes.value,
        ownerName:f.ownership.value==='Owned'?f.ownerName.value:null,ownerAddress:f.ownership.value==='Owned'?f.ownerAddress.value:null,
        rentalProvider:f.ownership.value==='Rented'?f.rentalProvider.value:null,rentalStart:f.ownership.value==='Rented'?f.rentalStart.value:null,rentalEnd:f.ownership.value==='Rented'?f.rentalEnd.value:null,rentalTerms:f.ownership.value==='Rented'?f.rentalTerms.value:null});
      if(oldBranch!==v.branch){branchHistory.push({vehicleId:v.id,branch:v.branch,from:new Date().toISOString().slice(0,10),to:null});}
    }
    showToast('Vehicle updated');editingVehicleId=null;
  } else {
    const id=Math.max(...vehicles.map(x=>x.id))+1;
    vehicles.push({id,number,type:f.type.value,brand:f.brand.value,model:f.model.value,regDate:f.regDate.value,capacity:parseFloat(f.capacity.value),capacityUnit:f.capacityUnit.value,ownership:f.ownership.value,
      ownerName:f.ownership.value==='Owned'?f.ownerName.value:null,ownerAddress:f.ownership.value==='Owned'?f.ownerAddress.value:null,
      rentalProvider:f.ownership.value==='Rented'?f.rentalProvider.value:null,rentalStart:f.ownership.value==='Rented'?f.rentalStart.value:null,rentalEnd:f.ownership.value==='Rented'?f.rentalEnd.value:null,rentalTerms:f.ownership.value==='Rented'?f.rentalTerms.value:null,
      branch:f.branch.value,status:'Available',notes:f.notes.value,createdAt:new Date().toISOString().slice(0,10)});
    showToast('Vehicle added');
  }
  navigate('vehicles');
}
function editVehicle(id){editingVehicleId=id;navigate('add-vehicle');}
function openVehicleDetail(id){selectedVehicleId=id;vehicleDetailTab='overview';navigate('vehicle-detail');}

function setVehicleStatus(id, status) {
  const v=vehicles.find(x=>x.id===id);
  if(!v) return;
  if(status==='Inactive'&&hasActiveTrip(id)){showToast('Cannot deactivate: vehicle has an active trip','error');return;}
  if(status==='Available'&&hasActiveTrip(id)){showToast('Cannot set Available: active trip exists','error');return;}
  if(status==='Under Maintenance'||status==='Inactive'){
    const active=driverAssignments.filter(x=>x.vehicleId===id&&x.status==='Active');
    // Same rule as individual release: cannot drop assignments while driver trip is Started/In Progress
    if(active.some(a=>isDriverOccupied(a.driverId))){
      showToast(`Cannot set ${status}: a linked driver has a Started/In Progress trip`,'error');
      return;
    }
    const n=releaseAllVehicleAssignments(id);
    v.status=status;
    closeModal();
    showToast(n?`Status set to ${status}; ${n} assignment(s) released to history`:`Status changed to ${status}`);
    render();
    return;
  }
  v.status=status;
  closeModal();showToast(`Status changed to ${status}`);render();
}
function confirmDeactivate(id) {
  const v=vehicles.find(x=>x.id===id);
  if(hasActiveTrip(id)){showToast('Cannot deactivate: active trip in progress','error');return;}
  openModal(`<div class="p-6 text-center"><div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-ban text-red-600 text-xl"></i></div>

}

function refreshAssignDriverList(){
  const sel=document.getElementById('assign-vehicle-select');
  if(!sel||!sel.value) return;
  openAssignDriver(parseInt(sel.value,10));
}
function submitAssignDriver(e) {
  e.preventDefault();
  const f=e.target;
  // Prefer hidden input when select is disabled (Assign more) — f.vehicleId.value breaks with duplicate names.
  const vehicleRaw=(
    f.querySelector('input[type="hidden"][name="vehicleId"]')?.value
    || f.querySelector('select[name="vehicleId"]')?.value
    || ''
  );
  const vehicleId=parseInt(vehicleRaw,10);
  const selected=[...f.querySelectorAll('input[name="driverIds"]:checked')].map(el=>parseInt(el.value,10));
  const v=vehicles.find(x=>x.id===vehicleId);
  if(!v||Number.isNaN(vehicleId)){showToast('Invalid vehicle','error');return;}
  if(v.status==='Under Maintenance'){showToast('Vehicle is under maintenance','error');return;}
  if(v.status==='Inactive'){showToast('Vehicle is inactive','error');return;}
  // Additional drivers only when vehicle occupancy is Available (does not clear existing assignments).
  if(isVehicleOccupied(vehicleId)){
    showToast('Cannot assign more drivers while vehicle occupancy is Occupied','error');
    return;
  }
  if(!selected.length){showToast('Select at least one driver','error');return;}

  let added=0;
  const errors=[];
  // Never release/complete existing assignments — only append new Active rows.
  selected.forEach(driverId=>{
    const d=drivers.find(x=>x.id===driverId);
    if(!d){errors.push('Invalid driver');return;}
    if(d.status==='Inactive'){errors.push(`${d.name}: inactive`);return;}
    if(isDriverOccupied(driverId)){errors.push(`${d.name}: occupied`);return;}
    if(isDriverAssignedToVehicle(driverId, vehicleId)){errors.push(`${d.name}: already on this vehicle`);return;}
    if(hasActiveDriverAssignment(driverId)){errors.push(`${d.name}: already assigned elsewhere`);return;}
    const nextId=Math.max(0,...driverAssignments.map(x=>x.id))+1;
    driverAssignments.unshift({id:nextId,vehicleId,driverId,start:nowStamp(),end:null,status:'Active'});
    d.status='Assigned';d.vehicleId=vehicleId;
    added++;
  });

  if(!added){
    showToast(errors[0]||'No drivers assigned','error');
    return;
  }
  if(v.status==='Available') v.status='Assigned';
  closeModal();
  showToast(added===1?`1 driver added (existing kept)`:`${added} drivers added (existing kept)`);
  if(errors.length) showToast(errors[0],'warning');
  render();
}
function releaseDriver(aid) {
  const a=driverAssignments.find(x=>x.id===aid);
  if(!a) return;
  // Trip Started / In Progress → block release. Pending / Completed / Cancelled → allow.
  if(isDriverOccupied(a.driverId)){
    showToast('Cannot release driver: trip is Started or In Progress','error');
    return;
  }
  a.status='Released';a.end=nowStamp();
  const v=vehicles.find(x=>x.id===a.vehicleId);
  const d=drivers.find(x=>x.id===a.driverId);
  // Only this assignment is released; other drivers on the same vehicle stay active.
  if(d && !hasActiveDriverAssignment(d.id)){
    d.vehicleId=null;
    d.status='Available';
  }
  const remaining=currentAssignments(a.vehicleId).length;
  if(v&&v.status==='Assigned'&&!remaining&&!hasActiveTrip(v.id)) v.status='Available';
  showToast('Driver unassigned');render();
}

/* ============================================================
   Change Driver — UI only (no API calls).
   FE contract (to wire later):
   - GET  /api/vehicle/assignments/drivers?vehicleId=   (eligible list + status)
   - GET  /api/vehicle/assignments/current               (assignment detail / trip context)
   - POST /api/vehicle/assignments/{id}/replace
         body: { replacementDriverId, reason? }
         success: { released: {...}, assigned: {...} }
         errors: 400 occupied / unavailable / duplicate, 404 not found
   ============================================================ */
function driverActiveTrip(driverId){
  return trips.find(t=>t.driverId===driverId&&['Assigned','Started','In Progress','Pending'].includes(t.status))||null;
}
function driverActiveTripLabel(driverId){
  const t=driverActiveTrip(driverId);
  return t?`Trip: ${t.status}`:'No active trip';
}
function canReplaceAssignment(a){
  if(!a||a.status!=='Active') return {ok:false, message:'Assignment is not active.'};
  if(isDriverOccupied(a.driverId)){
    return {ok:false, message:'Cannot change driver: trip is Started or In Progress.'};
  }
  const v=vehicles.find(x=>x.id===a.vehicleId);
  if(!v) return {ok:false, message:'Vehicle not found.'};
  if(v.status==='Inactive'||v.status==='Under Maintenance'){
    return {ok:false, message:`Cannot change driver: vehicle is ${v.status}.`};
  }
  return {ok:true, message:''};
}
function eligibleReplacementDrivers(vehicleId, currentDriverId){
  return drivers.map(d=>{
    let selectable=true, reason='Available';
    if(d.id===currentDriverId){selectable=false;reason='Current driver';}
    else if(d.status==='Inactive'){selectable=false;reason='Inactive';}
    else if(isDriverOccupied(d.id)){selectable=false;reason='Occupied';}
    else if(isDriverAssignedToVehicle(d.id, vehicleId)){selectable=false;reason='On this vehicle';}
    else if(hasActiveDriverAssignment(d.id)){selectable=false;reason='Already assigned';}
    return {...d, selectable, reason};
  });
}

  const a=driverAssignments.find(x=>x.id===aid);
  if(!a){showToast('Assignment not found','error');return;}
  const v=vehicles.find(x=>x.id===a.vehicleId);
  const d=drivers.find(x=>x.id===a.driverId);
  const trip=driverActiveTrip(a.driverId);
  const gate=canReplaceAssignment(a);
  const list=eligibleReplacementDrivers(a.vehicleId, a.driverId);
  const selectable=list.filter(x=>x.selectable);
  openModal(`<div class="p-6" id="change-driver-modal" data-assignment-id="${a.id}">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 text-sm">
      <div class="bg-slate-50 rounded-lg p-3">
        <p class="text-xs text-slate-500 mb-0.5">Vehicle</p>

      </div>
      <div class="bg-slate-50 rounded-lg p-3">
        <p class="text-xs text-slate-500 mb-0.5">Current Driver</p>
        <p class="font-medium">${d?.name||'—'}</p>
        <p class="text-xs text-slate-400 mt-0.5">${occupancyLabel(isDriverOccupied(a.driverId))} · ${driverActiveTripLabel(a.driverId)}</p>
      </div>
    </div>
    ${trip?`<div class="mb-4 text-sm border rounded-lg px-3 py-2 flex items-center justify-between gap-2">
      <div><span class="text-slate-500">Current trip</span> <span class="font-medium ml-1">${trip.ref}</span></div>
      ${badge(trip.status)}
    </div>`:''}
    <form id="change-driver-form" onsubmit="submitChangeDriver(event)">
      <input type="hidden" name="assignmentId" value="${a.id}" />
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Replacement Driver *</label>
        <select name="replacementDriverId" id="change-driver-select" required class="w-full border rounded-lg px-3 py-2 text-sm" ${gate.ok?'':'disabled'}>
          <option value="">Select replacement</option>
          ${selectable.map(x=>`<option value="${x.id}">${x.name} — ${x.reason}</option>`).join('')}
        </select>
        <div class="mt-2 border rounded-lg max-h-36 overflow-y-auto divide-y text-sm">

}
function submitChangeDriver(e){
  e.preventDefault();
  const f=e.target;
  const aid=parseInt(f.assignmentId.value,10);
  const a=driverAssignments.find(x=>x.id===aid);
  const gate=canReplaceAssignment(a);
  const alertEl=document.getElementById('change-driver-alert');
  if(!gate.ok){
    if(alertEl){alertEl.textContent=gate.message;alertEl.classList.remove('hidden');}
    showToast(gate.message,'error');
    return;
  }
  const newId=parseInt(f.replacementDriverId.value,10);
  const nd=drivers.find(x=>x.id===newId);
  if(!nd){showToast('Select a replacement driver','error');return;}
  if(nd.status==='Inactive'||isDriverOccupied(nd.id)||hasActiveDriverAssignment(nd.id)){
    showToast('Selected driver is not eligible','error');return;
  }
  // Show confirmation step (FE will call replace API after confirm)
  const confirmBox=document.getElementById('change-driver-confirm');
  const confirmText=document.getElementById('change-driver-confirm-text');
  const confirmBtn=document.getElementById('change-driver-confirm-btn');
  const submitBtn=document.getElementById('change-driver-submit-btn');
  if(confirmText) confirmText.textContent=`Replace ${dName(a.driverId)} with ${nd.name} on ${vNum(a.vehicleId)}.`;
  if(confirmBox) confirmBox.classList.remove('hidden');
  if(confirmBtn){confirmBtn.classList.remove('hidden');confirmBtn.dataset.ready='1';}
  if(submitBtn) submitBtn.classList.add('hidden');
}
function confirmChangeDriver(){
  const modal=document.getElementById('change-driver-modal');
  const f=document.getElementById('change-driver-form');
  if(!modal||!f) return;
  const aid=parseInt(f.assignmentId.value,10);
  const a=driverAssignments.find(x=>x.id===aid);
  const gate=canReplaceAssignment(a);
  if(!gate.ok){showToast(gate.message,'error');return;}
  const newId=parseInt(f.replacementDriverId.value,10);
  const nd=drivers.find(x=>x.id===newId);
  const od=drivers.find(x=>x.id===a.driverId);
  if(!nd){showToast('Select a replacement driver','error');return;}

  // Validate replacement eligibility (same rules as assign list)
  const elig=eligibleReplacementDrivers(a.vehicleId, a.driverId).find(x=>x.id===newId);
  if(!elig||!elig.selectable){
    showToast(elig?`Driver not eligible: ${elig.reason}`:'Selected driver is not eligible','error');
    return;
  }
  if(nd.id===a.driverId){showToast('Replacement must be a different driver','error');return;}

  const confirmBtn=document.getElementById('change-driver-confirm-btn');
  if(confirmBtn){confirmBtn.disabled=true;confirmBtn.innerHTML='<i class="fas fa-spinner fa-spin mr-1"></i> Replacing…';}

  // Local mock apply (UI preview) — FE will call replace API later
  setTimeout(()=>{
    const oldDriverId=a.driverId;
    const vehicleId=a.vehicleId;
    const reason=(f.reason.value||'').trim()||null;

    // 1) Preserve old assignment in history as Replaced (not manual Released)
    a.status='Replaced';
    a.end=nowStamp();
    if(reason) a.reason=reason;

    if(od&&!hasActiveDriverAssignment(od.id)&&!isDriverOccupied(od.id)){
      od.status='Available';od.vehicleId=null;
    }

    // 2) New active assignment for replacement
    const nextId=Math.max(0,...driverAssignments.map(x=>x.id))+1;
    driverAssignments.unshift({
      id:nextId,vehicleId,driverId:nd.id,
      start:nowStamp(),end:null,status:'Active',
      reason,replacedAssignmentId:a.id
    });
    nd.status='Assigned';nd.vehicleId=vehicleId;

    // 3) Eligible trip-driver link only (Assigned / Pending) — never change trip status or dates
    trips.filter(t=>
      t.vehicleId===vehicleId &&
      t.driverId===oldDriverId &&
      ['Assigned','Pending'].includes(t.status)
    ).forEach(t=>{ t.driverId=nd.id; });

    closeModal();
    showToast(`Driver changed to ${nd.name}. Previous assignment marked Replaced.`);
    render();
  }, 400);
}

function toggleTransferSelect(id, checked) {
  if (checked) {
    if (!transferSelectedIds.includes(id)) transferSelectedIds.push(id);
  } else {
    transferSelectedIds = transferSelectedIds.filter(x => x !== id);
  }
  render();
}
function toggleAllTransfer(checked) {
  if (checked) selectAllTransferable();
  else { clearTransferSelection(); render(); }
}
function selectAllTransferable() {
  transferSelectedIds = activities.filter(a => a.status !== 'Completed').map(a => a.id);
  render();
}
function clearTransferSelection() { transferSelectedIds = []; }

function openTransferActivity(activityId, mode) {
  // mode: 'single' | 'full' | 'partial'
  transferMode = mode || 'partial';
  transferSourceActivityId = activityId;
  let moving = [];
  let remaining = [];

  if (mode === 'single' && activityId) {
    moving = activities.filter(a => a.id === activityId);
  } else if (mode === 'full' && activityId) {
    const src = activities.find(a => a.id === activityId);
    const batch = src ? batchActivities(src.batchId).filter(a => a.status !== 'Completed') : [];
    moving = batch;
    remaining = [];
  } else {
    // partial from selection
    if (!transferSelectedIds.length) {
      showToast('Select at least one activity to transfer', 'warning');
      return;
    }
    moving = activities.filter(a => transferSelectedIds.includes(a.id));
    const batches = [...new Set(moving.map(a => a.batchId).filter(Boolean))];
    remaining = activities.filter(a =>
      batches.includes(a.batchId) && !transferSelectedIds.includes(a.id) && a.status !== 'Completed'
    );
  }

  if (!moving.length) {
    showToast('No transferable activities', 'warning');
    return;
  }

  const branches=[...new Set(moving.map(a=>a.branch).filter(Boolean))];
  if(branches.length>1){
    showToast(`Selected activities span multiple branches (${branches.join(', ')}). Transfer one branch at a time.`,'error');
    return;

function confirmTransferPreview(e) {
  e.preventDefault();
  const f = e.target;
  const movingIds = (f.movingIds.value || '').split(',').filter(Boolean).map(Number);
  const remainingIds = (f.remainingIds.value || '').split(',').filter(Boolean).map(Number);
  const newDriverId = f.newDriverId.value ? parseInt(f.newDriverId.value, 10) : null;
  const newDate = f.newDate.value || null;
  const plan = validateTransferPlan(movingIds, newDriverId, newDate);
  if (!plan.ok) {
    showToast(plan.errors[0], 'error');
    return;
  }
  const moving = plan.moving;
  const remaining = activities.filter(a => remainingIds.includes(a.id));
  const newDriver = newDriverId ? drivers.find(d => d.id === newDriverId) : null;

  openModalLg(`<div class="p-6">

function applyTransferDemo(movingIds, newDriverId, newDate) {
  // Validate fully first — no partial updates on failure
  const plan = validateTransferPlan(movingIds, newDriverId, newDate);
  if (!plan.ok) {
    showToast(plan.errors[0], 'error');
    return;
  }

  plan.moving.forEach(a => {
    if (newDate) {
      const rebuilt = rebuildScheduleOnDate(a.start, a.due, newDate);
      a.start = rebuilt.start;
      a.due = rebuilt.due;
    }
    const t = activityTrip(a);
    if (!t) return;
    const oldDriverId = t.driverId;
    if (newDate) {
      const tripRebuilt = rebuildScheduleOnDate(t.start || a.start, t.expected || a.due, newDate);
      t.start = tripRebuilt.start;
      t.expected = tripRebuilt.due;
    }
    if (newDriverId && newDriverId !== oldDriverId) {
      t.driverId = newDriverId;
      syncTripDriverAssignment(t, oldDriverId, newDriverId);
    }
  });

  clearTransferSelection();
  closeModal();
  showToast(`Transferred ${plan.moving.length} activity(ies)`);
  render();
}

function submitActivity(e) {
  e.preventDefault();
  const f = e.target;
  const branch = (f.branch.value || '').trim();
  if (!branch) { showToast('Please select a branch', 'error'); return; }
  if (new Date(f.due.value) <= new Date(f.start.value)) { showToast('Due must be after start', 'error'); return; }
  if (selectedCustomerIds.length === 0) { showToast('Please select at least one customer', 'error'); return; }
  if (!customersBelongToBranch(selectedCustomerIds, branch)) {
    showToast('All selected customers must belong to the selected branch', 'error');
    return;
  }

  const vehicleId = f.vehicleId.value ? parseInt(f.vehicleId.value, 10) : null;
  const driverId = f.driverId.value ? parseInt(f.driverId.value, 10) : null;
  const tripRef = (f.tripRef.value || '').trim();
  const hasAnyTripField = !!(vehicleId || driverId || tripRef);
  const hasAllTripFields = !!(vehicleId && driverId && tripRef);

  if (hasAnyTripField && !hasAllTripFields) {
    showToast('To create a trip now, fill Trip Reference, Vehicle, and Driver. Or leave all three empty to assign later.', 'error');
    return;
  }

  const startStamp = f.start.value.replace('T', ' ');
  const dueStamp = f.due.value.replace('T', ' ');
  if (!isScheduleValid(startStamp, dueStamp)) {
    showToast('Due must be after start', 'error');
    return;
  }

  let tripId = null;
  if (hasAllTripFields) {
    const v = vehicles.find(x => x.id === vehicleId);
    const d = drivers.find(x => x.id === driverId);
    if (!v || !d) { showToast('Invalid vehicle or driver', 'error'); return; }
    if (!isVehicleInBranch(vehicleId, branch)) { showToast('Vehicle must belong to the selected branch', 'error'); return; }
    if (!isDriverInBranch(driverId, branch)) { showToast('Driver must belong to the selected branch', 'error'); return; }
    if (['Inactive', 'Under Maintenance'].includes(v.status)) { showToast('Vehicle is not available', 'error'); return; }
    if (hasActiveTrip(vehicleId)) { showToast('Vehicle already has a conflicting active trip', 'error'); return; }
    if (isDriverOccupied(driverId)) { showToast('Driver is occupied on another trip', 'error'); return; }
    if (tripRefExists(tripRef)) { showToast(`Trip reference "${tripRef}" already exists`, 'error'); return; }
  }

  const id = Math.max(0, ...activities.map(x => x.id)) + 1;
  if (hasAllTripFields) {
    tripId = Math.max(0, ...trips.map(x => x.id)) + 1;
    const v = vehicles.find(x => x.id === vehicleId);
    trips.unshift({
      id: tripId, ref: tripRef, activityId: id, vehicleId, driverId,
      branch, start: startStamp, expected: dueStamp,
      actual: null, status: 'Assigned', customerIds: [...selectedCustomerIds]
    });
    if (v && v.status === 'Available') v.status = 'Assigned';
    selectedCustomerIds.forEach(cid => {
      const c = customers.find(x => x.id === cid);
      deliveries.push({
        id: Math.max(0, ...deliveries.map(x => x.id)) + 1, tripId, customerId: cid,
        address: c ? c.address : '', status: 'Pending', attempts: [], payment: null, returns: null, partialQty: null
      });
    });
  }

  activities.unshift({
    id, name: f.name.value, purpose: f.purpose.value, type: f.type.value,
    instructions: f.instructions.value, start: startStamp, due: dueStamp,
    priority: f.priority.value, status: 'Pending', tripId, previousTripIds: [], branch, batchId: null, customerIds: [...selectedCustomerIds]
  });
  const custCount = selectedCustomerIds.length;
  selectedCustomerIds = [];
  closeModal();
  showToast(tripId
    ? `Activity created with trip and ${custCount} customer(s)`
    : `Activity created without trip (${custCount} customer(s)). Use Assign Trip when ready.`);
  render();
}

function submitAssignTrip(e) {
  e.preventDefault();
  const f=e.target;
  const vehicleId=parseInt(f.vehicleId.value,10);
  const driverId=parseInt(f.driverId.value,10);
  const activityId=parseInt(f.activityId.value,10);
  const ref=(f.ref.value||'').trim();
  const v=vehicles.find(x=>x.id===vehicleId);
  const d=drivers.find(x=>x.id===driverId);
  const act=activities.find(x=>x.id===activityId);
  if(!v||!d||!act){showToast('Invalid selection','error');return;}
  if(act.tripId){showToast('Activity already has a trip','error');return;}
  if(!customersBelongToBranch(act.customerIds||[], act.branch)){
    showToast('Activity customers do not match its branch — fix data before assigning','error');return;
  }
  if(v.status==='Under Maintenance'||v.status==='Inactive'){showToast('Vehicle not available','error');return;}
  if(!isVehicleInBranch(vehicleId, act.branch)){showToast('Vehicle must belong to the activity branch','error');return;}
  if(!isDriverInBranch(driverId, act.branch)){showToast('Driver must belong to the activity branch','error');return;}
  if(hasActiveTrip(vehicleId)){showToast('Vehicle has a conflicting active trip','error');return;}
  if(isDriverOccupied(driverId)){showToast('Driver is occupied on another trip','error');return;}
  if(!ref){showToast('Trip reference is required','error');return;}
  if(tripRefExists(ref)){showToast(`Trip reference "${ref}" already exists`,'error');return;}
  const startStamp=f.start.value.replace('T',' ');
  const expectedStamp=f.expected.value.replace('T',' ');
  if(!isScheduleValid(startStamp, expectedStamp)){showToast('Expected must be after start','error');return;}
  const tripId=Math.max(0,...trips.map(x=>x.id))+1;
  const customerIds=[...(act.customerIds||[])];
  trips.unshift({id:tripId,ref,activityId,vehicleId,driverId,branch:act.branch||v.branch,start:startStamp,expected:expectedStamp,actual:null,status:'Assigned',customerIds});
  act.tripId=tripId;
  if(!Array.isArray(act.previousTripIds)) act.previousTripIds=[];
  if(act.status!=='Pending' && act.status!=='In Progress') act.status='Pending';
  if(v.status==='Available') v.status='Assigned';
  customerIds.forEach(cid=>{
    if(deliveries.some(x=>x.tripId===tripId&&x.customerId===cid)) return;
    const c=customers.find(x=>x.id===cid);
    deliveries.push({
      id:Math.max(0,...deliveries.map(x=>x.id))+1,tripId,customerId:cid,
      address:c?c.address:'',status:'Pending',attempts:[],payment:null,returns:null,partialQty:null
    });
  });
  closeModal();showToast(`Trip ${ref} assigned to ${act.name}`);render();
}
function startActivity(id) {
  const a=activities.find(x=>x.id===id);
  if(!a) return;
  if(a.status!=='Pending'){showToast('Only Pending activities can be started','error');return;}
  if(!a.tripId){showToast('Assign a trip before starting this activity','error');return;}
  const t=trips.find(x=>x.id===a.tripId);
  if(!t){showToast('Linked trip not found','error');return;}
  if(['Completed','Released','Cancelled'].includes(t.status)){showToast(`Cannot start: trip is ${t.status}`,'error');return;}
  // Exclude this trip — block only if another conflicting trip uses the same vehicle
  if(hasActiveTrip(t.vehicleId, t.id)){
    showToast('Vehicle already has another active trip','error');return;
  }
  if(isDriverOccupied(t.driverId, t.id)){
    showToast('Driver is occupied on another trip','error');return;
  }
  a.status='In Progress';
  t.status='In Progress';
  const v=vehicles.find(x=>x.id===t.vehicleId); if(v) v.status='In Use';
  const d=drivers.find(x=>x.id===t.driverId); if(d) d.status='On Duty';
  showToast('Activity started');render();
}
function completeActivity(id) {
  const a=activities.find(x=>x.id===id);
  if(!a) return;
  if(a.status!=='In Progress'){showToast('Only In Progress activities can be completed','error');return;}
  const openDels=pendingDeliveriesForActivity(a);
  if(openDels.length){
    const names=openDels.slice(0,3).map(d=>`${cName(d.customerId)} (${d.status})`).join(', ');
    showToast(`Cannot complete: ${openDels.length} delivery(ies) still open — ${names}${openDels.length>3?'…':''}`,'error');
    return;
  }
  a.status='Completed';
  if(a.tripId){
    const t=trips.find(x=>x.id===a.tripId);
    if(t){
      t.status='Completed';
      t.actual=new Date().toISOString().slice(0,16).replace('T',' ');
      const v=vehicles.find(x=>x.id===t.vehicleId);
      if(v&&['Assigned','In Use'].includes(v.status)&&!hasActiveTrip(v.id)){
        v.status=currentDriver(v.id)?'Assigned':'Available';
      }
      const d=drivers.find(x=>x.id===t.driverId);
      if(d&&d.status==='On Duty'&&!isDriverOccupied(d.id)) d.status=hasActiveDriverAssignment(d.id)?'Assigned':'Available';
    }
  }
  showToast('Activity completed');render();
}
function releaseTrip(tripId) {
  if(!tripId){showToast('No trip to release','error');return;}
  const t=trips.find(x=>x.id===tripId);
  if(!t) return;
  if(!['Assigned','Started','In Progress'].includes(t.status)){
    showToast(`Cannot release trip in status ${t.status}`,'error');return;
  }
  t.status='Released';
  const a=activities.find(x=>x.id===t.activityId);
  if(a&&a.status!=='Completed'){
    a.status='Pending';
    if(!Array.isArray(a.previousTripIds)) a.previousTripIds=[];
    if(!a.previousTripIds.includes(t.id)) a.previousTripIds.push(t.id);
    // Clear current link so a new trip can be assigned; history kept in previousTripIds
    if(a.tripId===t.id) a.tripId=null;
  }
  const v=vehicles.find(x=>x.id===t.vehicleId);
  if(v&&['Assigned','In Use'].includes(v.status)&&!hasActiveTrip(v.id)) v.status=currentDriver(v.id)?'Assigned':'Available';
  const d=drivers.find(x=>x.id===t.driverId);
  if(d&&d.status==='On Duty'&&!isDriverOccupied(d.id)) d.status=hasActiveDriverAssignment(d.id)?'Assigned':'Available';
  const openOnReleased=deliveries.filter(x=>x.tripId===t.id && !deliveryTerminalStatuses().includes(x.status));
  showToast(
    openOnReleased.length
      ? `Trip released (history kept). ${openOnReleased.length} open delivery(ies) stay on the released trip — not moved to a new trip.`
      : 'Trip released — kept in history; activity can be reassigned'
  );
  render();
}

function submitDeliveryOutcome(e, id) {
  e.preventDefault();
  const f=e.target;
  const d=deliveries.find(x=>x.id===id);

  const outcome=f.outcome.value;
  d.attempts.push({date:new Date().toISOString().slice(0,16).replace('T',' '),outcome,remarks:f.remarks.value,pod:f.files?.[0]?.name||null});
  d.status=outcome==='Returned'?'Failed':outcome;
  if(f.payMethod.value){d.payment={method:f.payMethod.value,amount:parseFloat(f.payAmount.value)||0,outstanding:0};}
  closeModal();showToast('Delivery outcome recorded');render();
}

      <div class="flex justify-end gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 text-sm">Cancel</button>

    </form></div>`);

function submitMaintenance(e) {
  e.preventDefault();
  const f=e.target;
  const vehicleId=parseInt(f.vehicleId.value);
  maintenanceRecords.unshift({id:Math.max(...maintenanceRecords.map(x=>x.id))+1,vehicleId,type:f.type.value,description:f.description.value,serviceDate:f.serviceDate.value,nextDue:f.nextDue.value||null,provider:f.provider.value,cost:parseFloat(f.cost.value)||0,status:'In Progress',bill:null});
  if(f.setMaint.value==='yes'){
    const v=vehicles.find(x=>x.id===vehicleId);
    if(v&&!hasActiveTrip(vehicleId)){
      const active=driverAssignments.filter(x=>x.vehicleId===vehicleId&&x.status==='Active');
      if(active.some(a=>isDriverOccupied(a.driverId))){
        showToast('Maintenance saved, but vehicle not marked Under Maintenance: driver has active trip','warning');
      } else {
        releaseAllVehicleAssignments(vehicleId);
        v.status='Under Maintenance';
      }
    }
  }
  closeModal();showToast('Maintenance record added');render();
}
function completeMaint(id) {
  const m=maintenanceRecords.find(x=>x.id===id);
  if(!m) return;
  m.status='Completed';
  const v=vehicles.find(x=>x.id===m.vehicleId);
  if(v&&v.status==='Under Maintenance'&&!maintenanceRecords.some(x=>x.vehicleId===v.id&&x.status==='In Progress'&&x.id!==id)){
    v.status=currentDriver(v.id)?'Assigned':'Available';
  }
  showToast('Maintenance completed');render();
}

  e.reviewHistory.push({
    action, by: 'Admin User',
    at: new Date().toISOString().slice(0, 16).replace('T', ' '),
    remarks
  });
  closeModal();
  showToast(`Expense ${action === 'Approved' ? 'approved' : action === 'Rejected' ? 'rejected' : 'returned for clarification'}`);
  render();
}

// ==================== REPORTING ====================
function renderReporting() {
  const fuelExp = expenses.filter(e => e.category === 'Fuel');
  const totalFuel = fuelExp.reduce((s, e) => s + e.amount, 0);
  const totalToll = expenses.filter(e => e.category === 'Toll').reduce((s, e) => s + e.amount, 0);
  const totalDriver = expenses.filter(e => e.category === 'Driver').reduce((s, e) => s + e.amount, 0);
  const totalMaint = maintenanceRecords.reduce((s, m) => s + m.cost, 0);
  const totalExp = expenses.reduce((s, e) => s + e.amount, 0);
  const totalTrips = trips.length;
  const completedTrips = trips.filter(t => t.status === 'Completed').length;
  const utilData = vehicles.map(v => {
    const vTrips = trips.filter(t => t.vehicleId === v.id);
    const completed = vTrips.filter(t => t.status === 'Completed').length;
    const active = vTrips.filter(t => ['Assigned', 'Started', 'In Progress'].includes(t.status)).length;
    const vExp = expenses.filter(e => e.vehicleId === v.id).reduce((s, e) => s + e.amount, 0);
    return { id: v.id, number: v.number, status: v.status, trips: vTrips.length, completed, active, expenses: vExp };
  });
  const vehiclesWithTrips = utilData.filter(u => u.trips > 0).length;
  const utilPct = vehicles.length ? Math.round((vehiclesWithTrips / vehicles.length) * 100) : 0;
  return `<div class="space-y-5 fade-in">
    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
      <div>
        <h3 class="text-base font-semibold text-slate-800">Operational Reporting</h3>
        <p class="text-sm text-slate-500 mt-0.5">Trip summary, vehicle utilization, and expense breakdowns from current demo data.</p>
      </div>
      <div class="flex items-center gap-2 text-sm text-slate-500 bg-white border border-slate-200 rounded-lg px-3 py-2">
        <i class="fas fa-calendar-alt text-slate-400"></i>
        <span>Demo period · Oct 2024</span>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600"><i class="fas fa-route"></i></div>
          <div><p class="text-xs text-slate-500">Total Trips</p><p class="text-xl font-bold text-slate-800">${totalTrips}</p></div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fas fa-check-double"></i></div>
          <div><p class="text-xs text-slate-500">Completed Trips</p><p class="text-xl font-bold text-emerald-700">${completedTrips}</p></div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600"><i class="fas fa-tachometer-alt"></i></div>
          <div><p class="text-xs text-slate-500">Vehicle Utilization</p><p class="text-xl font-bold text-blue-700">${utilPct}%</p></div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-orange-50 flex items-center justify-center text-orange-600"><i class="fas fa-rupee-sign"></i></div>
          <div><p class="text-xs text-slate-500">Total Expenses</p><p class="text-xl font-bold text-slate-800">₹${totalExp.toLocaleString()}</p></div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-100">
          <h4 class="text-sm font-semibold text-slate-700">Trip Summary</h4>
          <p class="text-xs text-slate-400 mt-0.5">Breakdown by trip status</p>
        </div>
        <div class="p-5 space-y-4">
          ${[
            { label: 'Completed', count: completedTrips, color: 'bg-emerald-500' },
            { label: 'In Progress', count: trips.filter(t => t.status === 'In Progress').length, color: 'bg-indigo-500' },
            { label: 'Started', count: trips.filter(t => t.status === 'Started').length, color: 'bg-blue-500' },
            { label: 'Assigned', count: trips.filter(t => t.status === 'Assigned').length, color: 'bg-sky-500' }
          ].map(s => {
            const pct = totalTrips ? Math.round((s.count / totalTrips) * 100) : 0;
            return `<div>
              <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-600">${s.label}</span><span class="font-medium text-slate-800">${s.count} <span class="text-slate-400 font-normal">(${pct}%)</span></span></div>
              <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${s.color} rounded-full transition-all" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-100">
          <h4 class="text-sm font-semibold text-slate-700">Expenses by Category</h4>
          <p class="text-xs text-slate-400 mt-0.5">Fuel, Toll and Driver related</p>
        </div>
        <div class="p-5 space-y-4">
          ${[
            { label: 'Fuel Related', amt: totalFuel, color: 'bg-orange-500', text: 'text-orange-700' },
            { label: 'Toll Related', amt: totalToll, color: 'bg-blue-500', text: 'text-blue-700' },
            { label: 'Driver Related', amt: totalDriver, color: 'bg-purple-500', text: 'text-purple-700' },
            { label: 'Maintenance Costs', amt: totalMaint, color: 'bg-amber-500', text: 'text-amber-700' }
          ].map(s => {
            const base = totalExp + totalMaint;
            const pct = base ? Math.round((s.amt / base) * 100) : 0;
            return `<div>
              <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-600">${s.label}</span><span class="font-medium ${s.text}">₹${s.amt.toLocaleString()}</span></div>
              <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${s.color} rounded-full" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h4 class="text-sm font-semibold text-slate-700">Vehicle Utilization</h4>
          <p class="text-xs text-slate-400 mt-0.5">${vehiclesWithTrips} of ${vehicles.length} vehicles have trip history · ${utilPct}% utilization</p>
        </div>
      </div>
      <div class="table-container">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="text-left px-4 py-3 font-medium">Vehicle</th>
              <th class="text-left px-4 py-3 font-medium">Status</th>
              <th class="text-left px-4 py-3 font-medium">Total Trips</th>
              <th class="text-left px-4 py-3 font-medium">Completed</th>
              <th class="text-left px-4 py-3 font-medium">Active</th>
              <th class="text-left px-4 py-3 font-medium">Expenses</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">${utilData.map(u => `
            <tr class="hover:bg-slate-50/80">
              <td class="px-4 py-3 font-medium text-slate-800">${u.number}</td>
              <td class="px-4 py-3">${badge(u.status)}</td>
              <td class="px-4 py-3">${u.trips}</td>
              <td class="px-4 py-3 text-emerald-700 font-medium">${u.completed}</td>
              <td class="px-4 py-3">${u.active ? `<span class="text-indigo-600 font-medium">${u.active}</span>` : '0'}</td>
              <td class="px-4 py-3">${u.expenses ? `₹${u.expenses.toLocaleString()}` : '—'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-100">
        <h4 class="text-sm font-semibold text-slate-700">Vehicle-wise Expense Summary</h4>
        <p class="text-xs text-slate-400 mt-0.5">Fuel, Toll and Driver expenses per vehicle</p>
      </div>
      <div class="table-container">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="text-left px-4 py-3 font-medium">Vehicle</th>
              <th class="text-left px-4 py-3 font-medium">Fuel</th>
              <th class="text-left px-4 py-3 font-medium">Toll</th>
              <th class="text-left px-4 py-3 font-medium">Driver</th>
              <th class="text-left px-4 py-3 font-medium">Total</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">${vehicles.map(v => {
            const fuel = expenses.filter(e => e.vehicleId === v.id && e.category === 'Fuel').reduce((s, e) => s + e.amount, 0);
            const toll = expenses.filter(e => e.vehicleId === v.id && e.category === 'Toll').reduce((s, e) => s + e.amount, 0);
            const drv = expenses.filter(e => e.vehicleId === v.id && e.category === 'Driver').reduce((s, e) => s + e.amount, 0);
            const tot = fuel + toll + drv;
            if (!tot) return '';
            return `<tr class="hover:bg-slate-50/80">
              <td class="px-4 py-3 font-medium text-slate-800">${v.number}</td>
              <td class="px-4 py-3 text-orange-700">${fuel ? '₹' + fuel.toLocaleString() : '—'}</td>
              <td class="px-4 py-3 text-blue-700">${toll ? '₹' + toll.toLocaleString() : '—'}</td>
              <td class="px-4 py-3 text-purple-700">${drv ? '₹' + drv.toLocaleString() : '—'}</td>
              <td class="px-4 py-3 font-semibold text-slate-800">₹${tot.toLocaleString()}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ==================== NOTIFICATIONS ====================
function showNotifications() {
  openModal(`<div class="p-6"><h3 class="text-lg font-semibold mb-4">Notifications</h3>
    <div class="space-y-3 max-h-80 overflow-y-auto">${notifications.map(n=>`
      <div class="border rounded-lg p-3 ${n.read?'':'bg-blue-50 border-blue-100'}">
        <p class="text-sm">${n.message}</p>
        <p class="text-xs text-slate-400 mt-1">${n.time} · ${n.type}</p>
      </div>`).join('')}</div>
    <div class="mt-4 text-right"><button onclick="notifications.forEach(n=>n.read=true);closeModal();document.getElementById('notif-dot').style.display='none'" class="px-4 py-2 text-sm border rounded-lg">Mark all read</button></div>
  </div>`);
}

// ==================== NAVIGATION ====================
const titles={dashboard:'Dashboard',vehicles:'Vehicle List','add-vehicle':'Add / Edit Vehicle','vehicle-detail':'Vehicle Details','driver-assignment':'Driver Assignment',activities:'Activities & Trips',deliveries:'Delivery Management',tracking:'Vehicle Tracking',maintenance:'Maintenance',documents:'Documents & Expiry',expenses:'Expense Review',reporting:'Reporting'};
const VM_VIEWS=new Set(['vehicles','add-vehicle','driver-assignment','vehicle-detail']);

function setVehicleMenuOpen(open) {
  const toggle=document.getElementById('vm-toggle');
  const sub=document.getElementById('vm-submenu');
  if(!toggle||!sub) return;
  toggle.classList.toggle('open', open);
  sub.classList.toggle('open', open);
}

function updateSidebarActive(view) {
  document.querySelectorAll('.sidebar-link').forEach(el=>{
    const isActive = el.dataset.view===view
      || (view==='vehicle-detail' && el.dataset.view==='vehicles');
    el.classList.toggle('active', isActive);
  });
  const parent=document.getElementById('vm-toggle');
  const inVm = VM_VIEWS.has(view);
  parent?.classList.toggle('active-parent', inVm);
  if(inVm) setVehicleMenuOpen(true);
}

function navigate(view) {
  currentView=view;
  if(view!=='add-vehicle') editingVehicleId=null;
  updateSidebarActive(view);
  document.getElementById('page-title').textContent=titles[view]||'LogiFleet';
  render();
  const sb=document.getElementById('sidebar');
  sb.classList.add('-translate-x-full');sb.classList.remove('translate-x-0');
}

function render() {
  const views={dashboard:renderDashboard,vehicles:renderVehicles,'add-vehicle':renderAddVehicle,'vehicle-detail':renderVehicleDetail,'driver-assignment':renderDriverAssignment,activities:renderActivities,deliveries:renderDeliveries,tracking:renderTracking,maintenance:renderMaintenance,documents:renderDocuments,expenses:renderExpenses,reporting:renderReporting};
  document.getElementById('main-content').innerHTML=(views[currentView]||renderDashboard)();
  if(currentView==='add-vehicle') setTimeout(toggleOwnershipFields,30);
}

// INIT
document.getElementById('vm-toggle')?.addEventListener('click',()=>{
  const sub=document.getElementById('vm-submenu');
  setVehicleMenuOpen(!sub.classList.contains('open'));
});
document.querySelectorAll('.sidebar-link').forEach(link=>{
  link.addEventListener('click',e=>{e.preventDefault();navigate(link.dataset.view);});
});
document.getElementById('menu-toggle')?.addEventListener('click',()=>{
  const sb=document.getElementById('sidebar');
  sb.classList.toggle('-translate-x-full');sb.classList.toggle('translate-x-0');
});
updateSidebarActive(currentView||'dashboard');
render();
</script>
